<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>E-mail confirmado</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="supabase.js"></script>
</head>


<body>

  <main class="auth-container">

    <section class="auth-card">

      <h1 id="titulo">
        Confirmando seu e-mail...
      </h1>

      <p id="mensagem">
        Aguarde alguns instantes.
      </p>

      <a
        id="continuarLink"
        href="login.html"
        style="display: none;"
      >
        Entrar na minha conta
      </a>

    </section>

  </main>



  <script>

    async function verificarConfirmacao() {

      const titulo =
        document.getElementById(
          'titulo'
        );

      const mensagem =
        document.getElementById(
          'mensagem'
        );

      const continuarLink =
        document.getElementById(
          'continuarLink'
        );


      /*
       * Dá um pequeno tempo para o
       * Supabase processar o retorno
       * presente na URL.
       */

      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            600
          )
      );


      const {
        data: {
          session
        },
        error
      } =
        await supabaseClient
          .auth
          .getSession();


      if (error) {

        console.error(
          error
        );

        titulo.textContent =
          'Não foi possível verificar';

        mensagem.textContent =
          'Ocorreu um erro ao verificar sua confirmação. Tente fazer login.';

        continuarLink.textContent =
          'Ir para o login';

        continuarLink.href =
          'login.html';

        continuarLink.style.display =
          'inline-block';

        return;

      }


      /*
       * Se o Supabase já criou a sessão,
       * significa que o link foi processado.
       */

      if (session) {

        titulo.textContent =
          'E-mail confirmado!';

        mensagem.textContent =
          'Sua conta foi confirmada com sucesso.';

        continuarLink.textContent =
          'Ir para minha conta';

        continuarLink.href =
          'conta.html';

        continuarLink.style.display =
          'inline-block';

        return;

      }


      /*
       * Mesmo sem sessão automática,
       * o usuário pode já ter sido
       * confirmado e apenas precisar
       * fazer login.
       */

      titulo.textContent =
        'Confirmação concluída';

      mensagem.textContent =
        'Agora entre na sua conta usando seu e-mail e senha.';

      continuarLink.textContent =
        'Entrar na minha conta';

      continuarLink.href =
        'login.html';

      continuarLink.style.display =
        'inline-block';

    }


    verificarConfirmacao();

  </script>

</body>

</html>
