<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Minha conta</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>

<body>

  <main class="auth-container">

    <section class="auth-card conta-card">

      <h1>Minha conta</h1>

      <p>
        Gerencie seus dados pessoais e endereço.
      </p>

      <p>
        E-mail:
        <strong id="userEmail">Carregando...</strong>
      </p>

      <form id="accountForm">

        <h2>Dados pessoais</h2>

        <label for="nomeCompleto">
          Nome completo
        </label>

        <input
          type="text"
          id="nomeCompleto"
          disabled
        >


        <label for="cpf">
          CPF
        </label>

        <input
          type="text"
          id="cpf"
          disabled
        >


        <label for="dataNascimento">
          Data de nascimento
        </label>

        <input
          type="date"
          id="dataNascimento"
          disabled
        >


        <label for="telefone">
          Telefone / WhatsApp
        </label>

        <input
          type="tel"
          id="telefone"
          disabled
        >


        <h2>Endereço</h2>

        <label for="cep">
          CEP
        </label>

        <input
          type="text"
          id="cep"
          disabled
        >


        <label for="rua">
          Rua / Avenida
        </label>

        <input
          type="text"
          id="rua"
          disabled
        >


        <label for="numero">
          Número
        </label>

        <input
          type="text"
          id="numero"
          disabled
        >


        <label for="complemento">
          Complemento
        </label>

        <input
          type="text"
          id="complemento"
          disabled
        >


        <label for="bairro">
          Bairro
        </label>

        <input
          type="text"
          id="bairro"
          disabled
        >


        <label for="cidade">
          Cidade
        </label>

        <input
          type="text"
          id="cidade"
          disabled
        >


        <label for="estado">
          Estado
        </label>

        <select
          id="estado"
          disabled
        >

          <option value="">Selecione</option>

          <option value="AC">AC</option>
          <option value="AL">AL</option>
          <option value="AP">AP</option>
          <option value="AM">AM</option>
          <option value="BA">BA</option>
          <option value="CE">CE</option>
          <option value="DF">DF</option>
          <option value="ES">ES</option>
          <option value="GO">GO</option>
          <option value="MA">MA</option>
          <option value="MT">MT</option>
          <option value="MS">MS</option>
          <option value="MG">MG</option>
          <option value="PA">PA</option>
          <option value="PB">PB</option>
          <option value="PR">PR</option>
          <option value="PE">PE</option>
          <option value="PI">PI</option>
          <option value="RJ">RJ</option>
          <option value="RN">RN</option>
          <option value="RS">RS</option>
          <option value="RO">RO</option>
          <option value="RR">RR</option>
          <option value="SC">SC</option>
          <option value="SP">SP</option>
          <option value="SE">SE</option>
          <option value="TO">TO</option>

        </select>


        <p id="accountMessage"></p>


        <button
          type="button"
          id="editBtn"
        >
          Editar dados
        </button>


        <button
          type="submit"
          id="saveBtn"
          style="display: none;"
        >
          Salvar alterações
        </button>


        <button
          type="button"
          id="cancelBtn"
          style="display: none;"
        >
          Cancelar
        </button>

      </form>


      <button
        type="button"
        id="logoutBtn"
      >
        Sair
      </button>


      <p>
        <a href="index.html">
          Voltar para o site
        </a>
      </p>

    </section>

  </main>


  <script>

    const accountForm =
      document.getElementById('accountForm');

    const accountMessage =
      document.getElementById('accountMessage');

    const editBtn =
      document.getElementById('editBtn');

    const saveBtn =
      document.getElementById('saveBtn');

    const cancelBtn =
      document.getElementById('cancelBtn');

    const logoutBtn =
      document.getElementById('logoutBtn');


    let usuarioAtual = null;
    let enderecoAtualId = null;


    async function carregarConta() {

      const {
        data: { session }
      } =
        await supabaseClient.auth.getSession();


      if (!session) {

        window.location.href =
          'login.html';

        return;

      }


      usuarioAtual =
        session.user;


      document.getElementById(
        'userEmail'
      ).textContent =
        usuarioAtual.email;


      /*
       * CARREGA PERFIL
       */

      const {
        data: perfil,
        error: perfilError
      } =
        await supabaseClient
          .from('profiles')
          .select('*')
          .eq(
            'id',
            usuarioAtual.id
          )
          .single();


      if (perfilError) {

        console.error(
          perfilError
        );

        accountMessage.textContent =
          'Erro ao carregar os dados pessoais.';

        return;

      }


      document.getElementById(
        'nomeCompleto'
      ).value =
        perfil.nome_completo || '';


      document.getElementById(
        'cpf'
      ).value =
        perfil.cpf || '';


      document.getElementById(
        'dataNascimento'
      ).value =
        perfil.data_nascimento || '';


      document.getElementById(
        'telefone'
      ).value =
        perfil.telefone || '';


      /*
       * CARREGA ENDEREÇO
       */

      const {
  data: enderecos,
  error: enderecoError
} =
  await supabaseClient
    .from('addresses')
    .select('*')
    .eq(
      'user_id',
      usuarioAtual.id
    )
    .order('updated_at', {
      ascending: false
    })
    .limit(1);


      if (enderecoError) {

        console.error(
          enderecoError
        );

        accountMessage.textContent =
          'Erro ao carregar o endereço.';

        return;

      }


      if (
        enderecos &&
        enderecos.length > 0
      ) {

        const endereco =
          enderecos[0];


        enderecoAtualId =
          endereco.id;


        document.getElementById(
          'cep'
        ).value =
          endereco.cep || '';


        document.getElementById(
          'rua'
        ).value =
          endereco.rua || '';


        document.getElementById(
          'numero'
        ).value =
          endereco.numero || '';


        document.getElementById(
          'complemento'
        ).value =
          endereco.complemento || '';


        document.getElementById(
          'bairro'
        ).value =
          endereco.bairro || '';


        document.getElementById(
          'cidade'
        ).value =
          endereco.cidade || '';


        document.getElementById(
          'estado'
        ).value =
          endereco.estado || '';

      }

    }


    function ativarEdicao() {

      document.getElementById(
        'nomeCompleto'
      ).disabled =
        false;

      document.getElementById(
        'telefone'
      ).disabled =
        false;

      document.getElementById(
        'cep'
      ).disabled =
        false;

      document.getElementById(
        'rua'
      ).disabled =
        false;

      document.getElementById(
        'numero'
      ).disabled =
        false;

      document.getElementById(
        'complemento'
      ).disabled =
        false;

      document.getElementById(
        'bairro'
      ).disabled =
        false;

      document.getElementById(
        'cidade'
      ).disabled =
        false;

      document.getElementById(
        'estado'
      ).disabled =
        false;


      editBtn.style.display =
        'none';

      saveBtn.style.display =
        'block';

      cancelBtn.style.display =
        'block';


      accountMessage.textContent =
        '';

    }


    function desativarEdicao() {

      document.getElementById(
        'nomeCompleto'
      ).disabled =
        true;

      document.getElementById(
        'telefone'
      ).disabled =
        true;

      document.getElementById(
        'cep'
      ).disabled =
        true;

      document.getElementById(
        'rua'
      ).disabled =
        true;

      document.getElementById(
        'numero'
      ).disabled =
        true;

      document.getElementById(
        'complemento'
      ).disabled =
        true;

      document.getElementById(
        'bairro'
      ).disabled =
        true;

      document.getElementById(
        'cidade'
      ).disabled =
        true;

      document.getElementById(
        'estado'
      ).disabled =
        true;


      editBtn.style.display =
        'block';

      saveBtn.style.display =
        'none';

      cancelBtn.style.display =
        'none';

    }


    editBtn.addEventListener(
      'click',
      ativarEdicao
    );


    cancelBtn.addEventListener(
      'click',
      async () => {

        desativarEdicao();

        await carregarConta();

      }
    );


    accountForm.addEventListener(
      'submit',
      async (event) => {

        event.preventDefault();


        accountMessage.textContent =
          'Salvando alterações...';


        /*
         * ATUALIZA PERFIL
         */

        const {
          error: profileError
        } =
          await supabaseClient
            .from('profiles')
            .update({

              nome_completo:
                document
                  .getElementById(
                    'nomeCompleto'
                  )
                  .value
                  .trim(),

              telefone:
                document
                  .getElementById(
                    'telefone'
                  )
                  .value
                  .trim(),

              updated_at:
                new Date()
                  .toISOString()

            })
            .eq(
              'id',
              usuarioAtual.id
            );


        if (profileError) {

          console.error(
            profileError
          );

          accountMessage.textContent =
            'Erro ao atualizar os dados pessoais: ' +
            profileError.message;

          return;

        }


        /*
         * DADOS DO ENDEREÇO
         */

        const endereco = {

          cep:
            document
              .getElementById(
                'cep'
              )
              .value
              .trim(),

          rua:
            document
              .getElementById(
                'rua'
              )
              .value
              .trim(),

          numero:
            document
              .getElementById(
                'numero'
              )
              .value
              .trim(),

          complemento:
            document
              .getElementById(
                'complemento'
              )
              .value
              .trim(),

          bairro:
            document
              .getElementById(
                'bairro'
              )
              .value
              .trim(),

          cidade:
            document
              .getElementById(
                'cidade'
              )
              .value
              .trim(),

          estado:
            document
              .getElementById(
                'estado'
              )
              .value,

          updated_at:
            new Date()
              .toISOString()

        };


        /*
         * ATUALIZA OU CRIA ENDEREÇO
         */

        if (enderecoAtualId) {

          const {
            error: enderecoUpdateError
          } =
            await supabaseClient
              .from('addresses')
              .update(
                endereco
              )
              .eq(
                'id',
                enderecoAtualId
              );


          if (enderecoUpdateError) {

            console.error(
              enderecoUpdateError
            );

            accountMessage.textContent =
              'Erro ao atualizar o endereço: ' +
              enderecoUpdateError.message;

            return;

          }

        }

        else {

          endereco.user_id =
            usuarioAtual.id;


          const {
            data: novoEndereco,
            error: enderecoInsertError
          } =
            await supabaseClient
              .from('addresses')
              .insert(
                endereco
              )
              .select()
              .single();


          if (enderecoInsertError) {

            console.error(
              enderecoInsertError
            );

            accountMessage.textContent =
              'Erro ao salvar o endereço: ' +
              enderecoInsertError.message;

            return;

          }


          enderecoAtualId =
            novoEndereco.id;

        }


        accountMessage.textContent =
          'Dados atualizados com sucesso.';


        desativarEdicao();

      }
    );


    logoutBtn.addEventListener(
      'click',
      async () => {

        await supabaseClient
          .auth
          .signOut();


        window.location.href =
          'index.html';

      }
    );


    carregarConta();

  </script>

</body>
</html>
