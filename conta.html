<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Minha conta</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="supabase.js"></script>
</head>


<body>

  <main class="auth-container">

    <section class="auth-card conta-card">

      <h1>Minha conta</h1>

      <p>
        Gerencie seus dados pessoais e endereço.
      </p>


      <p>
        E-mail:
        <strong id="userEmail">
          Carregando...
        </strong>
      </p>


      <form id="accountForm">

        <!-- ======================
             DADOS PESSOAIS
        ======================= -->

        <h2>Dados pessoais</h2>


        <label for="nomeCompleto">
          Nome completo
        </label>

        <input
          type="text"
          id="nomeCompleto"
          disabled
        >


        <label for="cpf">
          CPF
        </label>

        <input
          type="text"
          id="cpf"
          disabled
        >


        <label for="dataNascimento">
          Data de nascimento
        </label>

        <input
          type="date"
          id="dataNascimento"
          disabled
        >


        <label for="telefone">
          Telefone / WhatsApp
        </label>

        <input
          type="tel"
          id="telefone"
          disabled
        >



        <!-- ======================
             ENDEREÇO
        ======================= -->

        <h2>Endereço</h2>


        <label for="cep">
          CEP
        </label>

        <input
          type="text"
          id="cep"
          maxlength="9"
          disabled
        >


        <label for="rua">
          Rua / Avenida
        </label>

        <input
          type="text"
          id="rua"
          disabled
        >


        <label for="numero">
          Número
        </label>

        <input
          type="text"
          id="numero"
          disabled
        >


        <label for="complemento">
          Complemento
        </label>

        <input
          type="text"
          id="complemento"
          disabled
        >


        <label for="bairro">
          Bairro
        </label>

        <input
          type="text"
          id="bairro"
          disabled
        >


        <label for="cidade">
          Cidade
        </label>

        <input
          type="text"
          id="cidade"
          disabled
        >


        <label for="estado">
          Estado
        </label>

        <select
          id="estado"
          disabled
        >

          <option value="">
            Selecione
          </option>

          <option value="AC">AC</option>
          <option value="AL">AL</option>
          <option value="AP">AP</option>
          <option value="AM">AM</option>
          <option value="BA">BA</option>
          <option value="CE">CE</option>
          <option value="DF">DF</option>
          <option value="ES">ES</option>
          <option value="GO">GO</option>
          <option value="MA">MA</option>
          <option value="MT">MT</option>
          <option value="MS">MS</option>
          <option value="MG">MG</option>
          <option value="PA">PA</option>
          <option value="PB">PB</option>
          <option value="PR">PR</option>
          <option value="PE">PE</option>
          <option value="PI">PI</option>
          <option value="RJ">RJ</option>
          <option value="RN">RN</option>
          <option value="RS">RS</option>
          <option value="RO">RO</option>
          <option value="RR">RR</option>
          <option value="SC">SC</option>
          <option value="SP">SP</option>
          <option value="SE">SE</option>
          <option value="TO">TO</option>

        </select>


        <p id="accountMessage"></p>


        <!-- ======================
             BOTÕES
        ======================= -->

        <button
          type="button"
          id="editBtn"
        >
          Editar dados
        </button>


        <button
          type="submit"
          id="saveBtn"
          style="display: none;"
        >
          Salvar alterações
        </button>


        <button
          type="button"
          id="cancelBtn"
          style="display: none;"
        >
          Cancelar
        </button>

      </form>


      <button
        type="button"
        id="logoutBtn"
      >
        Sair
      </button>


      <p>
        <a href="index.html">
          Voltar para o site
        </a>
      </p>

    </section>

  </main>



  <script>

    /*
     * ============================
     * ELEMENTOS DA PÁGINA
     * ============================
     */

    const accountForm =
      document.getElementById(
        'accountForm'
      );

    const accountMessage =
      document.getElementById(
        'accountMessage'
      );

    const editBtn =
      document.getElementById(
        'editBtn'
      );

    const saveBtn =
      document.getElementById(
        'saveBtn'
      );

    const cancelBtn =
      document.getElementById(
        'cancelBtn'
      );

    const logoutBtn =
      document.getElementById(
        'logoutBtn'
      );


    let usuarioAtual = null;

    let enderecoAtualId = null;



    /*
     * ============================
     * CARREGAR CONTA
     * ============================
     */

    async function carregarConta() {

      accountMessage.textContent =
        'Carregando dados...';


      /*
       * Verifica sessão
       */

      const {
        data: {
          session
        },
        error: sessionError
      } =
        await supabaseClient
          .auth
          .getSession();


      if (sessionError) {

        console.error(
          sessionError
        );

        accountMessage.textContent =
          'Erro ao verificar sua sessão.';

        return;

      }


      /*
       * Se não estiver logado
       */

      if (!session) {

        window.location.href =
          'login.html';

        return;

      }


      usuarioAtual =
        session.user;


      document.getElementById(
        'userEmail'
      ).textContent =
        usuarioAtual.email;



      /*
       * ============================
       * CARREGA PERFIL
       * ============================
       */

      const {
        data: perfil,
        error: perfilError
      } =
        await supabaseClient

          .from('profiles')

          .select(
            `
              id,
              nome_completo,
              cpf,
              data_nascimento,
              telefone
            `
          )

          .eq(
            'id',
            usuarioAtual.id
          )

          .single();


      if (perfilError) {

        console.error(
          perfilError
        );

        accountMessage.textContent =
          'Erro ao carregar os dados pessoais: ' +
          perfilError.message;

        return;

      }


      document.getElementById(
        'nomeCompleto'
      ).value =
        perfil.nome_completo || '';


      document.getElementById(
        'cpf'
      ).value =
        perfil.cpf || '';


      document.getElementById(
        'dataNascimento'
      ).value =
        perfil.data_nascimento || '';


      document.getElementById(
        'telefone'
      ).value =
        perfil.telefone || '';



      /*
       * ============================
       * CARREGA ENDEREÇO
       * ============================
       *
       * Se por algum teste anterior
       * existirem vários endereços,
       * pega sempre o mais recente.
       */

      const {
        data: enderecos,
        error: enderecoError
      } =
        await supabaseClient

          .from('addresses')

          .select(
            `
              id,
              user_id,
              cep,
              rua,
              numero,
              complemento,
              bairro,
              cidade,
              estado,
              updated_at
            `
          )

          .eq(
            'user_id',
            usuarioAtual.id
          )

          .order(
            'updated_at',
            {
              ascending: false
            }
          )

          .limit(1);


      if (enderecoError) {

        console.error(
          enderecoError
        );

        accountMessage.textContent =
          'Erro ao carregar o endereço: ' +
          enderecoError.message;

        return;

      }


      /*
       * Limpa primeiro
       */

      enderecoAtualId = null;

      document.getElementById(
        'cep'
      ).value = '';

      document.getElementById(
        'rua'
      ).value = '';

      document.getElementById(
        'numero'
      ).value = '';

      document.getElementById(
        'complemento'
      ).value = '';

      document.getElementById(
        'bairro'
      ).value = '';

      document.getElementById(
        'cidade'
      ).value = '';

      document.getElementById(
        'estado'
      ).value = '';



      /*
       * Preenche endereço encontrado
       */

      if (
        enderecos &&
        enderecos.length > 0
      ) {

        const endereco =
          enderecos[0];


        enderecoAtualId =
          endereco.id;


        document.getElementById(
          'cep'
        ).value =
          endereco.cep || '';


        document.getElementById(
          'rua'
        ).value =
          endereco.rua || '';


        document.getElementById(
          'numero'
        ).value =
          endereco.numero || '';


        document.getElementById(
          'complemento'
        ).value =
          endereco.complemento || '';


        document.getElementById(
          'bairro'
        ).value =
          endereco.bairro || '';


        document.getElementById(
          'cidade'
        ).value =
          endereco.cidade || '';


        document.getElementById(
          'estado'
        ).value =
          endereco.estado || '';

      }


      accountMessage.textContent = '';

    }



    /*
     * ============================
     * ATIVAR EDIÇÃO
     * ============================
     */

    function ativarEdicao() {

      /*
       * Editáveis
       */

      document.getElementById(
        'nomeCompleto'
      ).disabled =
        false;


      document.getElementById(
        'telefone'
      ).disabled =
        false;


      document.getElementById(
        'cep'
      ).disabled =
        false;


      document.getElementById(
        'rua'
      ).disabled =
        false;


      document.getElementById(
        'numero'
      ).disabled =
        false;


      document.getElementById(
        'complemento'
      ).disabled =
        false;


      document.getElementById(
        'bairro'
      ).disabled =
        false;


      document.getElementById(
        'cidade'
      ).disabled =
        false;


      document.getElementById(
        'estado'
      ).disabled =
        false;



      /*
       * CPF e nascimento continuam
       * bloqueados propositalmente.
       */


      editBtn.style.display =
        'none';

      saveBtn.style.display =
        'block';

      cancelBtn.style.display =
        'block';


      accountMessage.textContent = '';

    }



    /*
     * ============================
     * DESATIVAR EDIÇÃO
     * ============================
     */

    function desativarEdicao() {

      document.getElementById(
        'nomeCompleto'
      ).disabled =
        true;


      document.getElementById(
        'telefone'
      ).disabled =
        true;


      document.getElementById(
        'cep'
      ).disabled =
        true;


      document.getElementById(
        'rua'
      ).disabled =
        true;


      document.getElementById(
        'numero'
      ).disabled =
        true;


      document.getElementById(
        'complemento'
      ).disabled =
        true;


      document.getElementById(
        'bairro'
      ).disabled =
        true;


      document.getElementById(
        'cidade'
      ).disabled =
        true;


      document.getElementById(
        'estado'
      ).disabled =
        true;


      editBtn.style.display =
        'block';

      saveBtn.style.display =
        'none';

      cancelBtn.style.display =
        'none';

    }



    /*
     * ============================
     * BOTÃO EDITAR
     * ============================
     */

    editBtn.addEventListener(
      'click',
      ativarEdicao
    );



    /*
     * ============================
     * BOTÃO CANCELAR
     * ============================
     */

    cancelBtn.addEventListener(
      'click',
      async () => {

        desativarEdicao();

        await carregarConta();

      }
    );



    /*
     * ============================
     * SALVAR ALTERAÇÕES
     * ============================
     */

    accountForm.addEventListener(
      'submit',
      async (event) => {

        event.preventDefault();


        if (!usuarioAtual) {

          accountMessage.textContent =
            'Usuário não identificado.';

          return;

        }


        accountMessage.textContent =
          'Salvando alterações...';



        /*
         * ============================
         * ATUALIZA PERFIL
         * ============================
         */

        const nomeCompleto =
          document
            .getElementById(
              'nomeCompleto'
            )
            .value
            .trim();


        const telefone =
          document
            .getElementById(
              'telefone'
            )
            .value
            .trim();


        const {
          data: perfilAtualizado,
          error: profileError
        } =
          await supabaseClient

            .from('profiles')

            .update({

              nome_completo:
                nomeCompleto,

              telefone:
                telefone,

              updated_at:
                new Date()
                  .toISOString()

            })

            .eq(
              'id',
              usuarioAtual.id
            )

            .select();


        if (profileError) {

          console.error(
            profileError
          );

          accountMessage.textContent =
            'Erro ao atualizar os dados pessoais: ' +
            profileError.message;

          return;

        }


        /*
         * Garante que realmente
         * atualizou o perfil.
         */

        if (
          !perfilAtualizado ||
          perfilAtualizado.length === 0
        ) {

          accountMessage.textContent =
            'Os dados pessoais não foram atualizados.';

          return;

        }



        /*
         * ============================
         * DADOS DO ENDEREÇO
         * ============================
         */

        const endereco = {

          cep:
            document
              .getElementById(
                'cep'
              )
              .value
              .trim(),

          rua:
            document
              .getElementById(
                'rua'
              )
              .value
              .trim(),

          numero:
            document
              .getElementById(
                'numero'
              )
              .value
              .trim(),

          complemento:
            document
              .getElementById(
                'complemento'
              )
              .value
              .trim(),

          bairro:
            document
              .getElementById(
                'bairro'
              )
              .value
              .trim(),

          cidade:
            document
              .getElementById(
                'cidade'
              )
              .value
              .trim(),

          estado:
            document
              .getElementById(
                'estado'
              )
              .value,

          updated_at:
            new Date()
              .toISOString()

        };



        /*
         * ============================
         * ATUALIZA ENDEREÇO EXISTENTE
         * ============================
         */

        if (enderecoAtualId) {

          const {
            data: enderecoAtualizado,
            error: enderecoUpdateError
          } =
            await supabaseClient

              .from('addresses')

              .update(
                endereco
              )

              .eq(
                'id',
                enderecoAtualId
              )

              .eq(
                'user_id',
                usuarioAtual.id
              )

              .select();


          if (enderecoUpdateError) {

            console.error(
              enderecoUpdateError
            );

            accountMessage.textContent =
              'Erro ao atualizar o endereço: ' +
              enderecoUpdateError.message;

            return;

          }


          /*
           * Garante que realmente
           * houve atualização.
           */

          if (
            !enderecoAtualizado ||
            enderecoAtualizado.length === 0
          ) {

            accountMessage.textContent =
              'O endereço não foi atualizado.';

            return;

          }

        }



        /*
         * ============================
         * CRIA ENDEREÇO SE NÃO EXISTIR
         * ============================
         */

        else {

          const enderecoNovo = {

            ...endereco,

            user_id:
              usuarioAtual.id

          };


          const {
            data: novoEndereco,
            error: enderecoInsertError
          } =
            await supabaseClient

              .from('addresses')

              .insert(
                enderecoNovo
              )

              .select()

              .single();


          if (enderecoInsertError) {

            console.error(
              enderecoInsertError
            );

            accountMessage.textContent =
              'Erro ao salvar o endereço: ' +
              enderecoInsertError.message;

            return;

          }


          enderecoAtualId =
            novoEndereco.id;

        }



        /*
         * ============================
         * SUCESSO
         * ============================
         */

        accountMessage.textContent =
          'Dados atualizados com sucesso.';


        desativarEdicao();


        /*
         * Recarrega novamente os dados
         * diretamente do Supabase.
         *
         * Isso também serve como
         * confirmação de que o banco
         * realmente recebeu os dados.
         */

        await carregarConta();


        accountMessage.textContent =
          'Dados atualizados com sucesso.';

      }
    );



    /*
     * ============================
     * LOGOUT
     * ============================
     */

    logoutBtn.addEventListener(
      'click',
      async () => {

        const {
          error
        } =
          await supabaseClient
            .auth
            .signOut();


        if (error) {

          console.error(
            error
          );

          accountMessage.textContent =
            'Erro ao sair da conta.';

          return;

        }


        window.location.href =
          'index.html';

      }
    );



    /*
     * ============================
     * MÁSCARA DO TELEFONE
     * ============================
     */

    const telefoneInput =
      document.getElementById(
        'telefone'
      );


    telefoneInput.addEventListener(
      'input',
      () => {

        let valor =
          telefoneInput
            .value
            .replace(
              /\D/g,
              ''
            )
            .slice(
              0,
              11
            );


        valor =
          valor.replace(
            /^(\d{2})(\d)/,
            '($1) $2'
          );


        valor =
          valor.replace(
            /(\d{5})(\d{4})$/,
            '$1-$2'
          );


        telefoneInput.value =
          valor;

      }
    );



    /*
     * ============================
     * MÁSCARA DO CEP
     * ============================
     */

    const cepInput =
      document.getElementById(
        'cep'
      );


    cepInput.addEventListener(
      'input',
      () => {

        let valor =
          cepInput
            .value
            .replace(
              /\D/g,
              ''
            )
            .slice(
              0,
              8
            );


        valor =
          valor.replace(
            /(\d{5})(\d)/,
            '$1-$2'
          );


        cepInput.value =
          valor;

      }
    );



    /*
     * ============================
     * INICIALIZA
     * ============================
     */

    carregarConta();

  </script>

</body>

</html>
