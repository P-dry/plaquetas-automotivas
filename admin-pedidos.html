<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Administração de pedidos</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <style>
    .cliente-busca-wrap {
      position: relative;
    }

    .cliente-ajuda {
      margin-top: 6px;
      color: #8f99a5;
      font-size: 12px;
      line-height: 1.4;
    }

    .veiculo-titulo {
      grid-column: 1 / -1;
      margin: 8px 0 -2px;
      padding-top: 18px;
      border-top: 1px solid #2a313b;
      font-size: 18px;
      font-weight: 700;
    }

    .admin-item-veiculo {
      grid-column: 1 / -1;
      color: #b8c0ca;
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 700px) {
      .veiculo-titulo {
        grid-column: auto;
      }

      .admin-item-veiculo {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

  <main class="auth-container admin-container">

    <section class="auth-card admin-card">

      <h1>Administração de pedidos</h1>

      <section class="admin-section">

        <h2>Novo pedido</h2>

        <form
          id="pedidoForm"
          class="admin-form-grid"
        >

          <div class="admin-form-full cliente-busca-wrap">

            <label for="clientePesquisa">
              Cliente
            </label>

            <input
              type="text"
              id="clientePesquisa"
              list="clientesLista"
              placeholder="Pesquisar por nome, telefone ou e-mail"
              autocomplete="off"
              required
            >

            <datalist id="clientesLista"></datalist>

            <div class="cliente-ajuda">
              Digite parte do nome, telefone ou e-mail e selecione o cliente.
            </div>

          </div>


          <div>

            <label for="produto">
              Produto
            </label>

            <select
              id="produto"
              required
            >

              <option value="Plaqueta de motor">
                Plaqueta de motor
              </option>

              <option value="Enfeite para retrovisor interno">
                Enfeite para retrovisor interno
              </option>

              <option value="Chaveiro personalizado">
                Chaveiro personalizado
              </option>

            </select>

          </div>


          <div>

            <label for="quantidade">
              Quantidade
            </label>

            <input
              type="number"
              id="quantidade"
              min="1"
              value="1"
              required
            >

          </div>


          <div>

            <label for="valorUnitario">
              Valor unitário
            </label>

            <input
              type="number"
              id="valorUnitario"
              min="0"
              step="0.01"
              required
            >

          </div>


          <div class="veiculo-titulo">
            Dados do veículo
          </div>


          <div>

            <label for="marcaVeiculo">
              Marca
            </label>

            <input
              type="text"
              id="marcaVeiculo"
              placeholder="Ex.: Ford"
              required
            >

          </div>


          <div>

            <label for="modeloVeiculo">
              Modelo
            </label>

            <input
              type="text"
              id="modeloVeiculo"
              placeholder="Ex.: Verona GLX"
              required
            >

          </div>


          <div>

            <label for="anoVeiculo">
              Ano / período
            </label>

            <input
              type="text"
              id="anoVeiculo"
              placeholder="Ex.: 1991/2026"
              required
            >

          </div>


          <div>

            <label for="furos">
              Furos
            </label>

            <select
              id="furos"
              required
            >

              <option value="Sim">
                Sim
              </option>

              <option value="Não">
                Não
              </option>

            </select>

          </div>


          <div class="admin-form-full">

            <label for="observacoes">
              Observações
            </label>

            <textarea
              id="observacoes"
              rows="3"
              placeholder="Informações adicionais sobre o pedido"
            ></textarea>

          </div>


          <div class="admin-form-full">

            <button type="submit">
              Criar pedido
            </button>

          </div>

        </form>

        <p id="mensagem"></p>

      </section>


      <section class="admin-section">

        <h2>Pedidos existentes</h2>

        <div class="admin-controles">

          <input
            type="number"
            id="pesquisaPedido"
            placeholder="Pesquisar pedido #"
            min="1"
          >

          <select id="ordenacaoPedidos">

            <option value="recentes">
              Mais recentes
            </option>

            <option value="antigos">
              Mais antigos
            </option>

            <option value="numero_crescente">
              Número crescente
            </option>

            <option value="numero_decrescente">
              Número decrescente
            </option>

          </select>

        </div>


        <div class="filtros-pedidos">

          <button
            type="button"
            data-status="todos"
          >
            Todos
          </button>

          <button
            type="button"
            data-status="aguardando_pagamento"
          >
            Aguardando
          </button>

          <button
            type="button"
            data-status="pago"
          >
            Pago
          </button>

          <button
            type="button"
            data-status="em_producao"
          >
            Produção
          </button>

          <button
            type="button"
            data-status="enviado"
          >
            Enviado
          </button>

          <button
            type="button"
            data-status="concluido"
          >
            Concluído
          </button>

          <button
            type="button"
            data-status="cancelado"
          >
            Cancelado
          </button>

        </div>


        <div id="listaPedidos">
          Carregando pedidos...
        </div>

      </section>


      <p class="admin-voltar">

        <a href="conta.html">
          Voltar para minha conta
        </a>

      </p>

    </section>

  </main>


  <script>

    const pedidoForm =
      document.getElementById('pedidoForm');

    const clientePesquisa =
      document.getElementById('clientePesquisa');

    const clientesLista =
      document.getElementById('clientesLista');

    const mensagem =
      document.getElementById('mensagem');

    const listaPedidos =
      document.getElementById('listaPedidos');

    const pesquisaPedido =
      document.getElementById('pesquisaPedido');

    const ordenacaoPedidos =
      document.getElementById('ordenacaoPedidos');


    let clientes = [];
    let clientesMap = {};
    let pedidosCarregados = [];
    let filtroAtual = 'todos';


    function formatarValor(valor) {

      return Number(valor).toLocaleString(
        'pt-BR',
        {
          style: 'currency',
          currency: 'BRL'
        }
      );

    }


    function formatarData(data) {

      return new Date(data)
        .toLocaleDateString('pt-BR');

    }


    function escaparHtml(valor) {

      return String(valor ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');

    }


    function normalizarTexto(valor) {

      return String(valor ?? '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .trim();

    }


    function montarLabelCliente(cliente) {

      return [
        cliente.nome_completo,
        cliente.telefone,
        cliente.email
      ]
        .filter(Boolean)
        .join(' · ');

    }


    function localizarCliente() {

      const pesquisa =
        normalizarTexto(
          clientePesquisa.value
        );

      if (!pesquisa) {
        return null;
      }


      const exato =
        clientes.find(
          cliente =>
            normalizarTexto(cliente.label) ===
            pesquisa
        );

      if (exato) {
        return exato;
      }


      const encontrados =
        clientes.filter(
          cliente =>
            normalizarTexto(cliente.label)
              .includes(pesquisa)
        );


      if (encontrados.length === 1) {
        return encontrados[0];
      }


      return null;

    }


    function montarDetalhesVeiculo(
      marca,
      modelo,
      ano,
      furos
    ) {

      return [
        `Marca: ${marca}`,
        `Modelo: ${modelo}`,
        `Ano/período: ${ano}`,
        `Furos: ${furos}`
      ].join(' | ');

    }


    function lerDetalhesVeiculo(texto) {

      if (!texto) {
        return null;
      }


      const dados = {};


      texto
        .split('|')
        .map(parte => parte.trim())
        .forEach(parte => {

          const indice =
            parte.indexOf(':');

          if (indice === -1) {
            return;
          }


          const chave =
            parte
              .slice(0, indice)
              .trim()
              .toLowerCase();

          const valor =
            parte
              .slice(indice + 1)
              .trim();


          dados[chave] =
            valor;

        });


      const marca =
        dados['marca'];

      const modelo =
        dados['modelo'];

      const ano =
        dados['ano/período'];

      const furos =
        dados['furos'];


      if (
        !marca &&
        !modelo &&
        !ano &&
        !furos
      ) {
        return null;
      }


      return {
        marca,
        modelo,
        ano,
        furos
      };

    }


    function formatarDetalhesVeiculo(texto) {

      const dados =
        lerDetalhesVeiculo(texto);


      if (!dados) {
        return escaparHtml(texto);
      }


      const veiculo =
        [
          dados.marca,
          dados.modelo
        ]
          .filter(Boolean)
          .join(' ');


      const partes = [];


      if (veiculo) {
        partes.push(veiculo);
      }


      if (dados.ano) {
        partes.push(dados.ano);
      }


      if (dados.furos) {

        partes.push(
          dados.furos === 'Sim'
            ? 'Com furos'
            : 'Sem furos'
        );

      }


      return partes
        .map(escaparHtml)
        .join(' · ');

    }


    async function verificarAdmin() {

      const {
        data: { session }
      } =
        await supabaseClient
          .auth
          .getSession();


      if (!session) {

        window.location.href =
          'login.html';

        return false;

      }


      const {
        data: admin
      } =
        await supabaseClient
          .from('admins')
          .select('user_id')
          .eq(
            'user_id',
            session.user.id
          )
          .maybeSingle();


      if (!admin) {

        window.location.href =
          'conta.html';

        return false;

      }


      return true;

    }


    async function consultarClientes() {

      const primeiraTentativa =
        await supabaseClient
          .from('profiles')
          .select(
            'id, nome_completo, telefone, email'
          )
          .order('nome_completo');


      if (!primeiraTentativa.error) {

        return {
          data:
            primeiraTentativa.data || [],
          error: null
        };

      }


      console.info(
        'E-mail não disponível em profiles. Usando nome e telefone.'
      );


      const segundaTentativa =
        await supabaseClient
          .from('profiles')
          .select(
            'id, nome_completo, telefone'
          )
          .order('nome_completo');


      return segundaTentativa;

    }


    async function carregarClientes() {

      const {
        data,
        error
      } =
        await consultarClientes();


      if (error) {

        console.error(error);

        mensagem.textContent =
          'Erro ao carregar clientes.';

        return;

      }


      clientes =
        (data || [])
          .map(cliente => ({
            ...cliente,
            label:
              montarLabelCliente(cliente)
          }));


      clientesMap = {};


      clientesLista.innerHTML = '';


      clientes.forEach(cliente => {

        clientesMap[cliente.id] =
          cliente.nome_completo;


        const option =
          document.createElement(
            'option'
          );


        option.value =
          cliente.label;


        clientesLista
          .appendChild(option);

      });

    }


    async function carregarPedidos() {

      const {
        data: pedidos,
        error
      } =
        await supabaseClient
          .from('orders')
          .select(`
            id,
            user_id,
            created_at,
            status,
            valor_total,
            observacoes,
            order_items (
              id,
              produto,
              quantidade,
              valor_unitario,
              detalhes_personalizacao
            )
          `);


      if (error) {

        console.error(error);

        listaPedidos.innerHTML =
          'Erro ao carregar pedidos.';

        return;

      }


      pedidosCarregados =
        pedidos || [];


      renderizarPedidos();

    }


    function renderizarPedidos() {

      let pedidos =
        [...pedidosCarregados];


      if (
        filtroAtual !==
        'todos'
      ) {

        pedidos =
          pedidos.filter(
            pedido =>
              pedido.status ===
              filtroAtual
          );

      }


      const pesquisa =
        pesquisaPedido
          .value
          .trim();


      if (pesquisa) {

        pedidos =
          pedidos.filter(
            pedido =>
              String(pedido.id) ===
              pesquisa
          );

      }


      const ordenacao =
        ordenacaoPedidos.value;


      if (
        ordenacao ===
        'recentes'
      ) {

        pedidos.sort(
          (a, b) =>
            new Date(b.created_at) -
            new Date(a.created_at)
        );

      }


      if (
        ordenacao ===
        'antigos'
      ) {

        pedidos.sort(
          (a, b) =>
            new Date(a.created_at) -
            new Date(b.created_at)
        );

      }


      if (
        ordenacao ===
        'numero_crescente'
      ) {

        pedidos.sort(
          (a, b) =>
            a.id - b.id
        );

      }


      if (
        ordenacao ===
        'numero_decrescente'
      ) {

        pedidos.sort(
          (a, b) =>
            b.id - a.id
        );

      }


      if (
        pedidos.length === 0
      ) {

        listaPedidos.innerHTML =
          '<p>Nenhum pedido encontrado.</p>';

        return;

      }


      listaPedidos.innerHTML =
        pedidos
          .map(pedido => {

            const cliente =
              clientesMap[
                pedido.user_id
              ] ||
              pedido.user_id;


            const itens =
              pedido.order_items ||
              [];


            const itensHtml =
              itens
                .map(item => {

                  const detalhes =
                    item
                      .detalhes_personalizacao;


                  return `

                    <div class="admin-item-linha">

                      <span>

                        <strong>
                          ${escaparHtml(item.produto)}
                        </strong>

                      </span>

                      <span>
                        Qtd:
                        ${escaparHtml(item.quantidade)}
                      </span>

                      <span>
                        ${formatarValor(item.valor_unitario)}
                      </span>

                      ${
                        detalhes
                          ? `
                            <span class="admin-item-veiculo">
                              ${formatarDetalhesVeiculo(detalhes)}
                            </span>
                          `
                          : ''
                      }

                    </div>

                  `;

                })
                .join('');


            return `

              <div class="pedido-card admin-pedido-card">

                <div class="admin-pedido-topo">

                  <div>

                    <a
                      href="pedido-detalhe.html?id=${pedido.id}"
                      class="pedido-detalhe-link"
                    >

                      <strong>
                        Pedido #${pedido.id}
                      </strong>

                    </a>

                  </div>

                  <div>
                    ${escaparHtml(cliente)}
                  </div>

                </div>


                <div class="admin-pedido-info">

                  <span>
                    ${formatarData(pedido.created_at)}
                  </span>

                  <span>
                    ${formatarValor(pedido.valor_total)}
                  </span>

                </div>


                <div class="admin-status">

                  <label
                    for="status-${pedido.id}"
                  >
                    Status
                  </label>

                  <select
                    id="status-${pedido.id}"
                    onchange="alterarStatus(${pedido.id}, this.value)"
                  >

                    <option
                      value="aguardando_pagamento"
                      ${
                        pedido.status ===
                        'aguardando_pagamento'
                          ? 'selected'
                          : ''
                      }
                    >
                      Aguardando pagamento
                    </option>

                    <option
                      value="pago"
                      ${
                        pedido.status ===
                        'pago'
                          ? 'selected'
                          : ''
                      }
                    >
                      Pago
                    </option>

                    <option
                      value="em_producao"
                      ${
                        pedido.status ===
                        'em_producao'
                          ? 'selected'
                          : ''
                      }
                    >
                      Em produção
                    </option>

                    <option
                      value="enviado"
                      ${
                        pedido.status ===
                        'enviado'
                          ? 'selected'
                          : ''
                      }
                    >
                      Enviado
                    </option>

                    <option
                      value="concluido"
                      ${
                        pedido.status ===
                        'concluido'
                          ? 'selected'
                          : ''
                      }
                    >
                      Concluído
                    </option>

                    <option
                      value="cancelado"
                      ${
                        pedido.status ===
                        'cancelado'
                          ? 'selected'
                          : ''
                      }
                    >
                      Cancelado
                    </option>

                  </select>

                </div>


                ${
                  pedido.observacoes
                    ? `

                      <div class="admin-observacao">

                        <strong>
                          Obs.:
                        </strong>

                        ${escaparHtml(pedido.observacoes)}

                      </div>

                    `
                    : ''
                }


                <div class="admin-itens">
                  ${itensHtml}
                </div>

              </div>

            `;

          })
          .join('');

    }


    function filtrarPedidos(status) {

      filtroAtual =
        status;


      document
        .querySelectorAll(
          '.filtros-pedidos button'
        )
        .forEach(botao => {

          botao.classList.toggle(
            'ativo',
            botao.dataset.status ===
              status
          );

        });


      renderizarPedidos();

    }


    document
      .querySelectorAll(
        '.filtros-pedidos button'
      )
      .forEach(botao => {

        botao.addEventListener(
          'click',
          () => {

            filtrarPedidos(
              botao.dataset.status
            );

          }
        );

      });


    pesquisaPedido
      .addEventListener(
        'input',
        renderizarPedidos
      );


    ordenacaoPedidos
      .addEventListener(
        'change',
        renderizarPedidos
      );


    async function alterarStatus(
      pedidoId,
      novoStatus
    ) {

      const {
        error
      } =
        await supabaseClient
          .from('orders')
          .update({
            status: novoStatus
          })
          .eq(
            'id',
            pedidoId
          );


      if (error) {

        console.error(error);

        alert(
          'Erro ao alterar o status.'
        );

        return;

      }


      mensagem.textContent =
        `Pedido #${pedidoId} atualizado com sucesso.`;


      await carregarPedidos();

    }


    pedidoForm
      .addEventListener(
        'submit',
        async event => {

          event.preventDefault();


          mensagem.textContent =
            'Criando pedido...';


          const cliente =
            localizarCliente();


          if (!cliente) {

            mensagem.textContent =
              'Selecione um cliente válido na pesquisa.';

            clientePesquisa.focus();

            return;

          }


          const produto =
            document
              .getElementById(
                'produto'
              )
              .value;


          const quantidade =
            Number(
              document
                .getElementById(
                  'quantidade'
                )
                .value
            );


          const valorUnitario =
            Number(
              document
                .getElementById(
                  'valorUnitario'
                )
                .value
            );


          const marca =
            document
              .getElementById(
                'marcaVeiculo'
              )
              .value
              .trim();


          const modelo =
            document
              .getElementById(
                'modeloVeiculo'
              )
              .value
              .trim();


          const ano =
            document
              .getElementById(
                'anoVeiculo'
              )
              .value
              .trim();


          const furos =
            document
              .getElementById(
                'furos'
              )
              .value;


          const observacoes =
            document
              .getElementById(
                'observacoes'
              )
              .value
              .trim();


          const detalhesVeiculo =
            montarDetalhesVeiculo(
              marca,
              modelo,
              ano,
              furos
            );


          const valorTotal =
            quantidade *
            valorUnitario;


          const {
            data: pedido,
            error: pedidoError
          } =
            await supabaseClient
              .from('orders')
              .insert({
                user_id:
                  cliente.id,

                status:
                  'pago',

                valor_total:
                  valorTotal,

                observacoes:
                  observacoes
              })
              .select()
              .single();


          if (pedidoError) {

            console.error(
              pedidoError
            );

            mensagem.textContent =
              'Erro ao criar o pedido.';

            return;

          }


          const {
            error: itemError
          } =
            await supabaseClient
              .from('order_items')
              .insert({
                order_id:
                  pedido.id,

                produto:
                  produto,

                quantidade:
                  quantidade,

                valor_unitario:
                  valorUnitario,

                detalhes_personalizacao:
                  detalhesVeiculo
              });


          if (itemError) {

            console.error(
              itemError
            );

            mensagem.textContent =
              'Pedido criado, mas houve erro ao criar o item.';

            return;

          }


          mensagem.textContent =
            `Pedido #${pedido.id} criado com sucesso.`;


          pedidoForm.reset();


          clientePesquisa.value =
            '';


          document
            .getElementById(
              'produto'
            )
            .value =
              'Plaqueta de motor';


          document
            .getElementById(
              'quantidade'
            )
            .value =
              '1';


          document
            .getElementById(
              'furos'
            )
            .value =
              'Sim';


          await carregarPedidos();

        }
      );


    async function iniciar() {

      const admin =
        await verificarAdmin();


      if (!admin) {
        return;
      }


      await carregarClientes();
      await carregarPedidos();

      filtrarPedidos('todos');

    }


    iniciar();

  </script>

</body>

</html>
