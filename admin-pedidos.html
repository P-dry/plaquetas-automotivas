<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Administração de pedidos</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>

<body>

  <main class="auth-container admin-container">

    <section class="auth-card admin-card">

      <h1>Administração de pedidos</h1>

      <section class="admin-section">
        <h2>Novo pedido</h2>

        <form id="pedidoForm" class="admin-form-grid">

          <div>
            <label for="cliente">Cliente</label>
            <select id="cliente" required>
              <option value="">Carregando clientes...</option>
            </select>
          </div>

          <div>
            <label for="produto">Produto</label>
            <input
              type="text"
              id="produto"
              value="Plaqueta personalizada"
              required
            >
          </div>

          <div>
            <label for="quantidade">Quantidade</label>
            <input
              type="number"
              id="quantidade"
              min="1"
              value="1"
              required
            >
          </div>

          <div>
            <label for="valorUnitario">Valor unitário</label>
            <input
              type="number"
              id="valorUnitario"
              min="0"
              step="0.01"
              required
            >
          </div>

          <div class="admin-form-full">
            <label for="personalizacao">Personalização</label>
            <textarea
              id="personalizacao"
              rows="3"
              placeholder="Ex.: Ford Verona 1991/2026"
            ></textarea>
          </div>

          <div class="admin-form-full">
            <label for="observacoes">Observações</label>
            <textarea
              id="observacoes"
              rows="2"
            ></textarea>
          </div>

          <div class="admin-form-full">
            <button type="submit">
              Criar pedido
            </button>
          </div>

        </form>

        <p id="mensagem"></p>
      </section>


      <section class="admin-section">

        <div class="admin-section-title">
          <h2>Pedidos existentes</h2>
        </div>

        <div class="filtros-pedidos">
          <button type="button" data-status="todos">Todos</button>
          <button type="button" data-status="aguardando_pagamento">Aguardando</button>
          <button type="button" data-status="pago">Pago</button>
          <button type="button" data-status="em_producao">Produção</button>
          <button type="button" data-status="enviado">Enviado</button>
          <button type="button" data-status="concluido">Concluído</button>
          <button type="button" data-status="cancelado">Cancelado</button>
        </div>

        <div id="listaPedidos">
          Carregando pedidos...
        </div>

      </section>


      <p class="admin-voltar">
        <a href="conta.html">
          Voltar para minha conta
        </a>
      </p>

    </section>

  </main>


  <script>

    const pedidoForm = document.getElementById('pedidoForm');
    const clienteSelect = document.getElementById('cliente');
    const mensagem = document.getElementById('mensagem');
    const listaPedidos = document.getElementById('listaPedidos');

    let clientesMap = {};
    let pedidosCarregados = [];
    let filtroAtual = 'todos';


    function formatarValor(valor) {
      return Number(valor).toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL'
      });
    }


    function formatarData(data) {
      return new Date(data).toLocaleDateString('pt-BR');
    }


    async function verificarAdmin() {

      const {
        data: { session }
      } = await supabaseClient.auth.getSession();

      if (!session) {
        window.location.href = 'login.html';
        return false;
      }

      const {
        data: admin
      } = await supabaseClient
        .from('admins')
        .select('user_id')
        .eq('user_id', session.user.id)
        .maybeSingle();

      if (!admin) {
        window.location.href = 'conta.html';
        return false;
      }

      return true;
    }


    async function carregarClientes() {

      const {
        data: clientes,
        error
      } = await supabaseClient
        .from('profiles')
        .select('id, nome_completo')
        .order('nome_completo');

      if (error) {
        console.error(error);
        mensagem.textContent = 'Erro ao carregar clientes.';
        return;
      }

      clientesMap = {};

      clienteSelect.innerHTML =
        '<option value="">Selecione o cliente</option>';

      clientes.forEach(cliente => {

        clientesMap[cliente.id] = cliente.nome_completo;

        const option = document.createElement('option');

        option.value = cliente.id;
        option.textContent = cliente.nome_completo;

        clienteSelect.appendChild(option);
      });
    }


    async function carregarPedidos() {

      const {
        data: pedidos,
        error
      } = await supabaseClient
        .from('orders')
        .select(`
          id,
          user_id,
          created_at,
          status,
          valor_total,
          observacoes,
          order_items (
            id,
            produto,
            quantidade,
            valor_unitario,
            detalhes_personalizacao
          )
        `)
        .order('created_at', { ascending: false });

      if (error) {
        console.error(error);
        listaPedidos.innerHTML = 'Erro ao carregar pedidos.';
        return;
      }

      pedidosCarregados = pedidos || [];

      renderizarPedidos();
    }


    function renderizarPedidos() {

      const pedidos = filtroAtual === 'todos'
        ? pedidosCarregados
        : pedidosCarregados.filter(
            pedido => pedido.status === filtroAtual
          );

      if (pedidos.length === 0) {
        listaPedidos.innerHTML =
          '<p>Nenhum pedido encontrado.</p>';
        return;
      }

      listaPedidos.innerHTML = pedidos.map(pedido => {

        const cliente =
          clientesMap[pedido.user_id] || pedido.user_id;

        const itens = pedido.order_items || [];

        const itensHtml = itens.map(item => `
          <div class="admin-item-linha">
            <span>
              <strong>${item.produto}</strong>
            </span>

            <span>
              Qtd: ${item.quantidade}
            </span>

            <span>
              ${formatarValor(item.valor_unitario)}
            </span>

            ${
              item.detalhes_personalizacao
                ? `
                  <span class="admin-item-personalizacao">
                    ${item.detalhes_personalizacao}
                  </span>
                `
                : ''
            }
          </div>
        `).join('');

        return `
          <div class="pedido-card admin-pedido-card">

            <div class="admin-pedido-topo">

              <div>
                <strong>Pedido #${pedido.id}</strong>
              </div>

              <div>
                ${cliente}
              </div>

            </div>

            <div class="admin-pedido-info">

              <span>
                ${formatarData(pedido.created_at)}
              </span>

              <span>
                ${formatarValor(pedido.valor_total)}
              </span>

            </div>

            <div class="admin-status">

              <label for="status-${pedido.id}">
                Status
              </label>

              <select
                id="status-${pedido.id}"
                onchange="alterarStatus(${pedido.id}, this.value)"
              >

                <option value="aguardando_pagamento"
                  ${pedido.status === 'aguardando_pagamento' ? 'selected' : ''}>
                  Aguardando pagamento
                </option>

                <option value="pago"
                  ${pedido.status === 'pago' ? 'selected' : ''}>
                  Pago
                </option>

                <option value="em_producao"
                  ${pedido.status === 'em_producao' ? 'selected' : ''}>
                  Em produção
                </option>

                <option value="enviado"
                  ${pedido.status === 'enviado' ? 'selected' : ''}>
                  Enviado
                </option>

                <option value="concluido"
                  ${pedido.status === 'concluido' ? 'selected' : ''}>
                  Concluído
                </option>

                <option value="cancelado"
                  ${pedido.status === 'cancelado' ? 'selected' : ''}>
                  Cancelado
                </option>

              </select>

            </div>

            ${
              pedido.observacoes
                ? `
                  <div class="admin-observacao">
                    <strong>Obs.:</strong>
                    ${pedido.observacoes}
                  </div>
                `
                : ''
            }

            <div class="admin-itens">
              ${itensHtml}
            </div>

          </div>
        `;
      }).join('');
    }


    function filtrarPedidos(status) {

      filtroAtual = status;

      document
        .querySelectorAll('.filtros-pedidos button')
        .forEach(botao => {
          botao.classList.toggle(
            'ativo',
            botao.dataset.status === status
          );
        });

      renderizarPedidos();
    }


    document
      .querySelectorAll('.filtros-pedidos button')
      .forEach(botao => {

        botao.addEventListener('click', () => {
          filtrarPedidos(botao.dataset.status);
        });

      });


    async function alterarStatus(pedidoId, novoStatus) {

      const {
        error
      } = await supabaseClient
        .from('orders')
        .update({
          status: novoStatus
        })
        .eq('id', pedidoId);

      if (error) {
        console.error(error);
        alert('Erro ao alterar o status.');
        return;
      }

      mensagem.textContent =
        `Pedido #${pedidoId} atualizado com sucesso.`;

      await carregarPedidos();
    }


    pedidoForm.addEventListener('submit', async (event) => {

      event.preventDefault();

      mensagem.textContent =
        'Criando pedido...';

      const userId = clienteSelect.value;
      const produto =
        document.getElementById('produto').value.trim();

      const quantidade =
        Number(document.getElementById('quantidade').value);

      const valorUnitario =
        Number(document.getElementById('valorUnitario').value);

      const personalizacao =
        document.getElementById('personalizacao').value.trim();

      const observacoes =
        document.getElementById('observacoes').value.trim();

      const valorTotal =
        quantidade * valorUnitario;


      const {
        data: pedido,
        error: pedidoError
      } = await supabaseClient
        .from('orders')
        .insert({
          user_id: userId,
          status: 'pago',
          valor_total: valorTotal,
          observacoes: observacoes
        })
        .select()
        .single();


      if (pedidoError) {
        console.error(pedidoError);
        mensagem.textContent = 'Erro ao criar o pedido.';
        return;
      }


      const {
        error: itemError
      } = await supabaseClient
        .from('order_items')
        .insert({
          order_id: pedido.id,
          produto: produto,
          quantidade: quantidade,
          valor_unitario: valorUnitario,
          detalhes_personalizacao: personalizacao
        });


      if (itemError) {
        console.error(itemError);
        mensagem.textContent =
          'Pedido criado, mas houve erro ao criar o item.';
        return;
      }


      mensagem.textContent =
        `Pedido #${pedido.id} criado com sucesso.`;

      pedidoForm.reset();

      document.getElementById('produto').value =
        'Plaqueta personalizada';

      document.getElementById('quantidade').value =
        '1';

      await carregarPedidos();
    });


    async function iniciar() {

      const admin =
        await verificarAdmin();

      if (!admin) {
        return;
      }

      await carregarClientes();
      await carregarPedidos();

      filtrarPedidos('todos');
    }


    iniciar();

  </script>

</body>

</html>
