<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>

<body>

  <main class="auth-container">

    <section class="auth-card">

      <h1>Entrar</h1>

      <p>
        Acesse sua conta.
      </p>


      <form id="loginForm">

        <label for="email">
          E-mail
        </label>

        <input
          type="email"
          id="email"
          placeholder="seuemail@email.com"
          required
        >


        <label for="password">
          Senha
        </label>

        <input
          type="password"
          id="password"
          placeholder="Sua senha"
          required
        >


        <button type="submit">
          Entrar
        </button>

      </form>


      <p id="loginMessage"></p>


      <p>
        Ainda não tem conta?
        <a href="cadastro.html">
          Criar conta
        </a>
      </p>


      <p>
        <a href="index.html">
          Voltar para o site
        </a>
      </p>

    </section>

  </main>


  <script>

    const loginForm =
      document.getElementById('loginForm');

    const loginMessage =
      document.getElementById('loginMessage');


    loginForm.addEventListener(
      'submit',
      async (event) => {

        event.preventDefault();

        loginMessage.textContent =
          'Entrando...';


        const email =
          document
            .getElementById('email')
            .value
            .trim();

        const password =
          document
            .getElementById('password')
            .value;


        try {

          /*
           * 1. FAZ LOGIN
           */

          const {
            data,
            error
          } =
            await supabaseClient.auth
              .signInWithPassword({
                email: email,
                password: password
              });


          if (error) {

            console.error(error);

            loginMessage.textContent =
              'Erro: ' + error.message;

            return;
          }


          if (!data.user) {

            loginMessage.textContent =
              'Não foi possível identificar o usuário.';

            return;
          }


          /*
           * 2. VERIFICA SE EXISTE
           * ENDEREÇO PENDENTE
           */

          const enderecoPendente =
            localStorage.getItem(
              'enderecoCadastroPendente'
            );


          if (enderecoPendente) {

            const endereco =
              JSON.parse(enderecoPendente);


            /*
             * Antes de inserir, verifica se
             * este usuário já possui endereço.
             */

            const {
              data: enderecosExistentes,
              error: consultaEnderecoError
            } =
              await supabaseClient
                .from('addresses')
                .select('id')
                .eq(
                  'user_id',
                  data.user.id
                )
                .limit(1);


            if (consultaEnderecoError) {

              console.error(
                consultaEnderecoError
              );

            }


            /*
             * Só salva se ainda não houver
             * endereço cadastrado.
             */

            if (
              !consultaEnderecoError &&
              enderecosExistentes &&
              enderecosExistentes.length === 0
            ) {

              const {
                error: addressError
              } =
                await supabaseClient
                  .from('addresses')
                  .insert({

                    user_id:
                      data.user.id,

                    cep:
                      endereco.cep,

                    rua:
                      endereco.rua,

                    numero:
                      endereco.numero,

                    complemento:
                      endereco.complemento,

                    bairro:
                      endereco.bairro,

                    cidade:
                      endereco.cidade,

                    estado:
                      endereco.estado

                  });


              if (addressError) {

                console.error(
                  addressError
                );

                loginMessage.textContent =
                  'Login realizado, mas ocorreu um erro ao salvar seu endereço: ' +
                  addressError.message;

                return;
              }

            }


            /*
             * Após salvar ou encontrar
             * endereço existente,
             * remove o temporário.
             */

            localStorage.removeItem(
              'enderecoCadastroPendente'
            );

          }


          /*
           * 3. LOGIN CONCLUÍDO
           */

          loginMessage.textContent =
            'Login realizado com sucesso.';


          window.location.href =
            'conta.html';

        }

        catch (erro) {

          console.error(erro);

          loginMessage.textContent =
            'Erro ao conectar com o sistema de login.';

        }

      }
    );

  </script>

</body>
</html>
