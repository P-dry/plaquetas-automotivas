<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Entrar | ÍMALLOY</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <style>

    .login-extra {
      margin-top: 10px;
      text-align: right;
    }

    .login-extra a {
      font-size: 13px;
    }

  </style>

</head>

<body>

  <main class="auth-container">

    <section class="auth-card">

      <h1>
        Entrar
      </h1>

      <p>
        Acesse sua conta ÍMALLOY.
      </p>


      <form id="loginForm">

        <label for="email">
          E-mail
        </label>

        <input
          type="email"
          id="email"
          placeholder="seuemail@email.com"
          autocomplete="email"
          required
        >


        <label for="password">
          Senha
        </label>

        <input
          type="password"
          id="password"
          placeholder="Sua senha"
          autocomplete="current-password"
          required
        >


        <div class="login-extra">

          <a href="recuperar-senha.html">
            Esqueci minha senha
          </a>

        </div>


        <button type="submit">
          Entrar
        </button>

      </form>


      <p id="loginMessage"></p>


      <p>
        Ainda não tem conta?

        <a href="cadastro.html">
          Criar conta
        </a>
      </p>


      <p>

        <a href="index.html">
          Voltar para o site
        </a>

      </p>

    </section>

  </main>


  <script>

    const loginForm =
      document.getElementById(
        'loginForm'
      );

    const loginMessage =
      document.getElementById(
        'loginMessage'
      );


    const finalizarPedidoKey =
      'imalloyFinalizarPedido';

    const enderecoPendenteKey =
      'enderecoCadastroPendente';


    /*
     * ============================
     * MENSAGEM DE ERRO
     * ============================
     */

    function mensagemErroLogin(
      erro
    ) {

      const mensagem =
        String(
          erro?.message ||
          ''
        )
          .toLowerCase();


      if (
        mensagem.includes(
          'invalid login credentials'
        )
      ) {

        return (
          'E-mail ou senha incorretos.'
        );

      }


      if (
        mensagem.includes(
          'email not confirmed'
        )
      ) {

        return (
          'Seu e-mail ainda não foi confirmado. ' +
          'Verifique sua caixa de entrada.'
        );

      }


      if (
        mensagem.includes(
          'rate limit'
        ) ||
        mensagem.includes(
          'too many'
        )
      ) {

        return (
          'Foram feitas muitas tentativas. ' +
          'Tente novamente mais tarde.'
        );

      }


      return (
        'Não foi possível entrar. ' +
        'Confira seus dados e tente novamente.'
      );

    }


    /*
     * ============================
     * SALVA ENDEREÇO PENDENTE
     * ============================
     */

    async function salvarEnderecoPendente(
      userId
    ) {

      const texto =
        localStorage
          .getItem(
            enderecoPendenteKey
          );


      if (
        !texto
      ) {

        return true;

      }


      let endereco;


      try {

        endereco =
          JSON.parse(
            texto
          );

      }

      catch (
        erro
      ) {

        console.error(
          erro
        );

        localStorage
          .removeItem(
            enderecoPendenteKey
          );

        return true;

      }


      /*
       * Verifica se o usuário já possui
       * algum endereço cadastrado.
       *
       * Isso evita cadastrar o mesmo
       * endereço novamente em logins
       * posteriores.
       */

      const {
        data: enderecos,
        error:
          consultaError
      } =
        await supabaseClient
          .from(
            'addresses'
          )
          .select(
            'id'
          )
          .eq(
            'user_id',
            userId
          )
          .limit(
            1
          );


      if (
        consultaError
      ) {

        console.error(
          consultaError
        );

        return false;

      }


      if (
        enderecos &&
        enderecos.length >
        0
      ) {

        localStorage
          .removeItem(
            enderecoPendenteKey
          );

        return true;

      }


      const {
        error:
          insertError
      } =
        await supabaseClient
          .from(
            'addresses'
          )
          .insert({

            user_id:
              userId,

            cep:
              endereco.cep ||
              '',

            rua:
              endereco.rua ||
              '',

            numero:
              endereco.numero ||
              '',

            complemento:
              endereco.complemento ||
              '',

            bairro:
              endereco.bairro ||
              '',

            cidade:
              endereco.cidade ||
              '',

            estado:
              endereco.estado ||
              ''

          });


      if (
        insertError
      ) {

        console.error(
          insertError
        );

        return false;

      }


      localStorage
        .removeItem(
          enderecoPendenteKey
        );


      return true;

    }


    /*
     * ============================
     * LOGIN
     * ============================
     */

    loginForm.addEventListener(
      'submit',
      async event => {

        event.preventDefault();


        loginMessage.textContent =
          'Entrando...';


        const email =
          document
            .getElementById(
              'email'
            )
            .value
            .trim();


        const password =
          document
            .getElementById(
              'password'
            )
            .value;


        try {

          const {
            data,
            error
          } =
            await supabaseClient
              .auth
              .signInWithPassword({

                email:
                  email,

                password:
                  password

              });


          if (
            error
          ) {

            console.error(
              error
            );

            loginMessage.textContent =
              mensagemErroLogin(
                error
              );

            return;

          }


          if (
            !data.user
          ) {

            loginMessage.textContent =
              'Não foi possível entrar.';

            return;

          }


          /*
           * Tenta salvar eventual endereço
           * que ficou pendente depois da
           * confirmação do cadastro.
           */

          const enderecoSalvo =
            await salvarEnderecoPendente(
              data.user.id
            );


          if (
            !enderecoSalvo
          ) {

            console.warn(
              'Não foi possível salvar o endereço pendente.'
            );

          }


          /*
           * Se o cliente estava finalizando
           * um pedido antes do login,
           * volta para a personalização.
           */

          const finalizarPedido =
            localStorage
              .getItem(
                finalizarPedidoKey
              );


          if (
            finalizarPedido ===
            '1'
          ) {

            window
              .location
              .href =
                'index.html#personalizar';

            return;

          }


          /*
           * Login normal.
           */

          window
            .location
            .href =
              'conta.html';

        }

        catch (
          erro
        ) {

          console.error(
            erro
          );

          loginMessage.textContent =
            (
              'Não foi possível conectar ao sistema. ' +
              'Tente novamente.'
            );

        }

      }
    );

  </script>

</body>

</html>
