<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Meus pedidos</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>

<body>

  <main class="auth-container">

    <section class="auth-card">

      <h1>Meus pedidos</h1>

      <p>
        Acompanhe seus pedidos e o andamento da produção.
      </p>

      <div id="pedidosLista">
        Carregando pedidos...
      </div>

      <p id="pedidosMessage"></p>

      <p>
        <a href="conta.html">
          Voltar para minha conta
        </a>
      </p>

      <p>
        <a href="index.html">
          Voltar para o site
        </a>
      </p>

    </section>

  </main>


  <script>

    const pedidosLista = document.getElementById('pedidosLista');
    const pedidosMessage = document.getElementById('pedidosMessage');

    function formatarValor(valor) {
      return Number(valor).toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL'
      });
    }

    function formatarData(data) {
      return new Date(data).toLocaleDateString('pt-BR');
    }

    function formatarStatus(status) {
      const nomes = {
        aguardando_pagamento: 'Aguardando pagamento',
        pago: 'Pago',
        em_producao: 'Em produção',
        enviado: 'Enviado',
        concluido: 'Concluído',
        cancelado: 'Cancelado'
      };

      return nomes[status] || status;
    }

    async function carregarPedidos() {

      const {
        data: { session },
        error: sessionError
      } = await supabaseClient.auth.getSession();

      if (sessionError || !session) {
        window.location.href = 'login.html';
        return;
      }

      const {
        data: pedidos,
        error
      } = await supabaseClient
        .from('orders')
        .select(`
          id,
          created_at,
          status,
          valor_total,
          observacoes,
          order_items (
            id,
            produto,
            quantidade,
            valor_unitario,
            detalhes_personalizacao
          )
        `)
        .eq('user_id', session.user.id)
        .order('created_at', { ascending: false });

      if (error) {
        console.error(error);
        pedidosLista.innerHTML = '';
        pedidosMessage.textContent = 'Erro ao carregar os pedidos.';
        return;
      }

      if (!pedidos || pedidos.length === 0) {
        pedidosLista.innerHTML = '<p>Você ainda não possui pedidos.</p>';
        return;
      }

      pedidosLista.innerHTML = pedidos.map(pedido => {

        const itens = pedido.order_items || [];

        const itensHtml = itens.length > 0
          ? itens.map(item => `
              <div class="pedido-item">
                <strong>${item.produto}</strong>

                <p>
                  Quantidade: ${item.quantidade}
                </p>

                <p>
                  Valor unitário:
                  ${formatarValor(item.valor_unitario)}
                </p>

                ${
                  item.detalhes_personalizacao
                    ? `
                      <p>
                        Personalização:
                        ${item.detalhes_personalizacao}
                      </p>
                    `
                    : ''
                }
              </div>
            `).join('')
          : '<p>Nenhum item cadastrado neste pedido.</p>';

        return `
          <div class="pedido-card">

            <h2>
              Pedido #${pedido.id}
            </h2>

            <p>
              <strong>Data:</strong>
              ${formatarData(pedido.created_at)}
            </p>

            <p>
              <strong>Status:</strong>
              ${formatarStatus(pedido.status)}
            </p>

            <p>
              <strong>Valor total:</strong>
              ${formatarValor(pedido.valor_total)}
            </p>

            ${
              pedido.observacoes
                ? `
                  <p>
                    <strong>Observações:</strong>
                    ${pedido.observacoes}
                  </p>
                `
                : ''
            }

            <h3>Itens do pedido</h3>

            ${itensHtml}

          </div>
        `;
      }).join('');
    }

    carregarPedidos();

  </script>

</body>

</html>
