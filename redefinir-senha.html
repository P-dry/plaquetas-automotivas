<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Redefinir senha</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

</head>

<body>

  <main class="auth-container">

    <section class="auth-card">

      <h1>
        Criar nova senha
      </h1>

      <p>
        Digite a nova senha que deseja usar na sua conta.
      </p>


      <form id="passwordForm">

        <label for="password">
          Nova senha
        </label>

        <input
          type="password"
          id="password"
          placeholder="Nova senha"
          minlength="6"
          autocomplete="new-password"
          required
        >


        <label for="passwordConfirm">
          Confirmar nova senha
        </label>

        <input
          type="password"
          id="passwordConfirm"
          placeholder="Digite novamente"
          minlength="6"
          autocomplete="new-password"
          required
        >


        <button
          id="passwordButton"
          type="submit"
          disabled
        >
          Verificando link...
        </button>

      </form>


      <p id="passwordMessage"></p>


      <p>

        <a href="recuperar-senha.html">
          Solicitar outro link
        </a>

      </p>


      <p>

        <a href="login.html">
          Voltar para o login
        </a>

      </p>

    </section>

  </main>


  <script>

    const passwordForm =
      document.getElementById(
        'passwordForm'
      );

    const passwordButton =
      document.getElementById(
        'passwordButton'
      );

    const passwordMessage =
      document.getElementById(
        'passwordMessage'
      );


    let linkRecuperacaoValido =
      false;


    function liberarFormulario() {

      linkRecuperacaoValido =
        true;

      passwordButton.disabled =
        false;

      passwordButton.textContent =
        'Salvar nova senha';

      passwordMessage.textContent =
        '';

    }


    function bloquearFormulario() {

      linkRecuperacaoValido =
        false;

      passwordButton.disabled =
        true;

      passwordButton.textContent =
        'Link inválido';

      passwordMessage.textContent =
        (
          'Este link de recuperação é inválido ou expirou. ' +
          'Solicite um novo link.'
        );

    }


    /*
     * O Supabase dispara este evento
     * quando a página é aberta pelo
     * link de recuperação.
     */

    supabaseClient.auth.onAuthStateChange(
      (
        event,
        session
      ) => {

        if (
          event ===
            'PASSWORD_RECOVERY' &&
          session
        ) {

          liberarFormulario();

        }

      }
    );


    async function verificarSessaoRecuperacao() {

      /*
       * Dá tempo para o cliente do
       * Supabase processar os dados
       * recebidos pelo link.
       */

      await new Promise(
        resolve => {

          setTimeout(
            resolve,
            500
          );

        }
      );


      const {
        data: {
          session
        },
        error
      } =
        await supabaseClient
          .auth
          .getSession();


      if (error) {

        console.error(
          error
        );

      }


      const url =
        window.location.href;


      const possuiDadosRecuperacao =
        (
          url.includes(
            'type=recovery'
          ) ||
          url.includes(
            'access_token='
          ) ||
          url.includes(
            'code='
          )
        );


      if (
        session &&
        possuiDadosRecuperacao
      ) {

        liberarFormulario();

        return;

      }


      /*
       * Espera mais um pouco porque
       * PASSWORD_RECOVERY pode chegar
       * logo depois do getSession().
       */

      setTimeout(
        () => {

          if (
            !linkRecuperacaoValido
          ) {

            bloquearFormulario();

          }

        },
        1000
      );

    }


    passwordForm.addEventListener(
      'submit',
      async event => {

        event.preventDefault();


        if (
          !linkRecuperacaoValido
        ) {

          passwordMessage.textContent =
            'Solicite um novo link de recuperação.';

          return;

        }


        const password =
          document
            .getElementById(
              'password'
            )
            .value;


        const passwordConfirm =
          document
            .getElementById(
              'passwordConfirm'
            )
            .value;


        if (
          password.length <
          6
        ) {

          passwordMessage.textContent =
            'A senha deve ter pelo menos 6 caracteres.';

          return;

        }


        if (
          password !==
          passwordConfirm
        ) {

          passwordMessage.textContent =
            'As senhas informadas não são iguais.';

          return;

        }


        passwordButton.disabled =
          true;

        passwordButton.textContent =
          'Salvando...';

        passwordMessage.textContent =
          '';


        try {

          const {
            error
          } =
            await supabaseClient
              .auth
              .updateUser({
                password:
                  password
              });


          if (error) {

            console.error(
              error
            );


            passwordMessage.textContent =
              'Não foi possível alterar a senha. Tente novamente.';


            passwordButton.disabled =
              false;

            passwordButton.textContent =
              'Salvar nova senha';

            return;

          }


          passwordMessage.textContent =
            'Senha alterada com sucesso.';


          passwordForm.reset();


          passwordButton.disabled =
            true;

          passwordButton.textContent =
            'Senha alterada';


          /*
           * Encerra a sessão temporária
           * da recuperação.
           */

          await supabaseClient
            .auth
            .signOut();


          setTimeout(
            () => {

              window.location.href =
                'login.html';

            },
            1500
          );

        }

        catch (erro) {

          console.error(
            erro
          );


          passwordMessage.textContent =
            'Erro ao conectar com o sistema.';


          passwordButton.disabled =
            false;

          passwordButton.textContent =
            'Salvar nova senha';

        }

      }
    );


    verificarSessaoRecuperacao();

  </script>

</body>

</html>
