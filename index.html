  <!-- =========================

  ========================== -->

  <style>

    .product-carousel {
      position: relative;
    }

    .product-card {
      transition:
        opacity 0.16s ease,
        transform 0.16s ease;

      will-change:
        opacity,
        transform;
    }

    .product-card.is-leaving-next {
      opacity: 0;
      transform: translateX(-6px);
    }

    .product-card.is-leaving-prev {
      opacity: 0;
      transform: translateX(6px);
    }

    .product-card.is-entering-next {
      opacity: 0;
      transform: translateX(6px);
      transition: none;
    }

    .product-card.is-entering-prev {
      opacity: 0;
      transform: translateX(-6px);
      transition: none;
    }

    .product-carousel-nav {
      position: absolute;
      top: 50%;
      z-index: 5;

      width: 42px;
      height: 42px;

      border:
        1px solid rgba(255, 255, 255, 0.14);

      border-radius: 50%;

      background: #14181e;
      color: #fff;

      font: inherit;
      font-size: 28px;
      line-height: 1;

      cursor: pointer;

      transform:
        translateY(-50%);

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .product-carousel-nav:hover {
      background: #20262e;

      border-color:
        rgba(255, 255, 255, 0.28);
    }

    .product-carousel-nav:active {
      transform:
        translateY(-50%)
        scale(0.94);
    }

    .product-carousel-prev {
      left: -21px;
    }

    .product-carousel-next {
      right: -21px;
    }

    .product-carousel-dots {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 9px;

      margin-top: 18px;
    }

    .product-carousel-dot {
      width: 9px;
      height: 9px;

      padding: 0;
      border: 0;

      border-radius: 50%;

      background: #4b535e;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    .product-carousel-dot.active {
      background: #fff;

      transform:
        scale(1.25);
    }

    @media (max-width: 900px) {

      .product-carousel-prev {
        left: 10px;
      }

      .product-carousel-next {
        right: 10px;
      }

    }

  </style>
