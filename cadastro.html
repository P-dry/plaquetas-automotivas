<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Criar conta</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>


<body>

  <main class="auth-container">

    <section class="auth-card cadastro-card">

      <h1>Criar conta</h1>

      <p>
        Preencha seus dados para criar sua conta.
      </p>


      <form id="signupForm">

        <!-- =====================
             DADOS PESSOAIS
        ====================== -->

        <h2>Dados pessoais</h2>


        <label for="nomeCompleto">
          Nome completo
        </label>

        <input
          type="text"
          id="nomeCompleto"
          placeholder="Seu nome completo"
          required
        >


        <label for="cpf">
          CPF
        </label>

        <input
          type="text"
          id="cpf"
          placeholder="000.000.000-00"
          maxlength="14"
          required
        >


        <label for="dataNascimento">
          Data de nascimento
        </label>

        <input
          type="date"
          id="dataNascimento"
          required
        >


        <label for="telefone">
          Telefone / WhatsApp
        </label>

        <input
          type="tel"
          id="telefone"
          placeholder="(11) 99999-9999"
          maxlength="15"
          required
        >



        <!-- =====================
             ACESSO
        ====================== -->

        <h2>Acesso</h2>


        <label for="email">
          E-mail
        </label>

        <input
          type="email"
          id="email"
          placeholder="seuemail@email.com"
          required
        >


        <label for="password">
          Senha
        </label>

        <input
          type="password"
          id="password"
          placeholder="Crie uma senha"
          minlength="6"
          required
        >



        <!-- =====================
             ENDEREÇO
        ====================== -->

        <h2>Endereço</h2>


        <label for="cep">
          CEP
        </label>

        <input
          type="text"
          id="cep"
          placeholder="00000-000"
          maxlength="9"
          required
        >

        <small id="cepMessage"></small>


        <label for="rua">
          Rua / Avenida
        </label>

        <input
          type="text"
          id="rua"
          placeholder="Nome da rua"
          required
        >


        <label for="numero">
          Número
        </label>

        <input
          type="text"
          id="numero"
          placeholder="Número"
          required
        >


        <label for="complemento">
          Complemento
        </label>

        <input
          type="text"
          id="complemento"
          placeholder="Apartamento, bloco, referência..."
        >


        <label for="bairro">
          Bairro
        </label>

        <input
          type="text"
          id="bairro"
          placeholder="Bairro"
          required
        >


        <label for="cidade">
          Cidade
        </label>

        <input
          type="text"
          id="cidade"
          placeholder="Cidade"
          required
        >


        <label for="estado">
          Estado
        </label>

        <select
          id="estado"
          required
        >

          <option value="">
            Selecione
          </option>

          <option value="AC">AC</option>
          <option value="AL">AL</option>
          <option value="AP">AP</option>
          <option value="AM">AM</option>
          <option value="BA">BA</option>
          <option value="CE">CE</option>
          <option value="DF">DF</option>
          <option value="ES">ES</option>
          <option value="GO">GO</option>
          <option value="MA">MA</option>
          <option value="MT">MT</option>
          <option value="MS">MS</option>
          <option value="MG">MG</option>
          <option value="PA">PA</option>
          <option value="PB">PB</option>
          <option value="PR">PR</option>
          <option value="PE">PE</option>
          <option value="PI">PI</option>
          <option value="RJ">RJ</option>
          <option value="RN">RN</option>
          <option value="RS">RS</option>
          <option value="RO">RO</option>
          <option value="RR">RR</option>
          <option value="SC">SC</option>
          <option value="SP">SP</option>
          <option value="SE">SE</option>
          <option value="TO">TO</option>

        </select>


        <button type="submit">
          Criar conta
        </button>

      </form>


      <p id="signupMessage"></p>


      <p>
        Já tem conta?

        <a href="login.html">
          Entrar
        </a>
      </p>


      <p>
        <a href="index.html">
          Voltar para o site
        </a>
      </p>

    </section>

  </main>



  <script>

    /*
     * ============================
     * ELEMENTOS
     * ============================
     */

    const signupForm =
      document.getElementById('signupForm');

    const signupMessage =
      document.getElementById('signupMessage');

    const cepInput =
      document.getElementById('cep');

    const cepMessage =
      document.getElementById('cepMessage');

    const ruaInput =
      document.getElementById('rua');

    const bairroInput =
      document.getElementById('bairro');

    const cidadeInput =
      document.getElementById('cidade');

    const estadoInput =
      document.getElementById('estado');


    /*
     * Página para onde o cliente
     * será enviado depois de
     * confirmar o e-mail.
     */

    const emailRedirectUrl =
      'https://p-dry.github.io/plaquetas-automotivas/confirmado.html';



    /*
     * ============================
     * CADASTRO
     * ============================
     */

    signupForm.addEventListener(
      'submit',
      async (event) => {

        event.preventDefault();


        signupMessage.textContent =
          'Criando conta...';



        /*
         * ============================
         * COLETA DOS DADOS
         * ============================
         */

        const nomeCompleto =
          document
            .getElementById('nomeCompleto')
            .value
            .trim();


        const cpf =
          document
            .getElementById('cpf')
            .value
            .trim();


        const dataNascimento =
          document
            .getElementById('dataNascimento')
            .value;


        const telefone =
          document
            .getElementById('telefone')
            .value
            .trim();


        const email =
          document
            .getElementById('email')
            .value
            .trim();


        const password =
          document
            .getElementById('password')
            .value;


        const cep =
          cepInput
            .value
            .trim();


        const rua =
          ruaInput
            .value
            .trim();


        const numero =
          document
            .getElementById('numero')
            .value
            .trim();


        const complemento =
          document
            .getElementById('complemento')
            .value
            .trim();


        const bairro =
          bairroInput
            .value
            .trim();


        const cidade =
          cidadeInput
            .value
            .trim();


        const estado =
          estadoInput
            .value;



        try {

          /*
           * ============================
           * CRIA USUÁRIO
           * ============================
           */

          const {
            data: signupData,
            error: signupError
          } =
            await supabaseClient
              .auth
              .signUp({

                email:
                  email,

                password:
                  password,

                options: {

                  emailRedirectTo:
                    emailRedirectUrl,

                  data: {

                    nome_completo:
                      nomeCompleto,

                    cpf:
                      cpf,

                    data_nascimento:
                      dataNascimento,

                    telefone:
                      telefone

                  }

                }

              });



          /*
           * ============================
           * ERRO NO CADASTRO
           * ============================
           */

          if (signupError) {

            console.error(
              signupError
            );

            signupMessage.textContent =
              'Erro ao criar conta: ' +
              signupError.message;

            return;

          }



          if (!signupData.user) {

            signupMessage.textContent =
              'Não foi possível criar o usuário.';

            return;

          }



          /*
           * ============================
           * ENDEREÇO
           * ============================
           *
           * Caso já exista sessão,
           * salva diretamente.
           */

          if (signupData.session) {

            const {
              error: addressError
            } =
              await supabaseClient

                .from('addresses')

                .insert({

                  user_id:
                    signupData.user.id,

                  cep:
                    cep,

                  rua:
                    rua,

                  numero:
                    numero,

                  complemento:
                    complemento,

                  bairro:
                    bairro,

                  cidade:
                    cidade,

                  estado:
                    estado

                });


            if (addressError) {

              console.error(
                addressError
              );

              signupMessage.textContent =
                'Conta criada, mas ocorreu um erro ao salvar o endereço: ' +
                addressError.message;

              return;

            }

          }

          else {

            /*
             * ============================
             * ENDEREÇO PENDENTE
             * ============================
             *
             * Se o usuário ainda precisa
             * confirmar o e-mail, guardamos
             * temporariamente no navegador.
             */

            const enderecoTemporario = {

              cep:
                cep,

              rua:
                rua,

              numero:
                numero,

              complemento:
                complemento,

              bairro:
                bairro,

              cidade:
                cidade,

              estado:
                estado

            };


            localStorage.setItem(
              'enderecoCadastroPendente',
              JSON.stringify(
                enderecoTemporario
              )
            );

          }



          /*
           * ============================
           * SUCESSO
           * ============================
           */

          signupMessage.textContent =
            'Conta criada com sucesso. Enviamos um e-mail de confirmação. Abra o e-mail e clique no link para confirmar sua conta.';


          signupForm.reset();

          cepMessage.textContent = '';

        }

        catch (erro) {

          console.error(
            erro
          );

          signupMessage.textContent =
            'Erro ao conectar com o sistema de cadastro.';

        }

      }
    );



    /*
     * ============================
     * MÁSCARA DE CPF
     * ============================
     */

    const cpfInput =
      document.getElementById('cpf');


    cpfInput.addEventListener(
      'input',
      () => {

        let valor =
          cpfInput
            .value
            .replace(/\D/g, '')
            .slice(0, 11);


        valor =
          valor.replace(
            /(\d{3})(\d)/,
            '$1.$2'
          );


        valor =
          valor.replace(
            /(\d{3})(\d)/,
            '$1.$2'
          );


        valor =
          valor.replace(
            /(\d{3})(\d{1,2})$/,
            '$1-$2'
          );


        cpfInput.value =
          valor;

      }
    );



    /*
     * ============================
     * MÁSCARA DE CEP
     * ============================
     */

    cepInput.addEventListener(
      'input',
      () => {

        let valor =
          cepInput
            .value
            .replace(/\D/g, '')
            .slice(0, 8);


        valor =
          valor.replace(
            /(\d{5})(\d)/,
            '$1-$2'
          );


        cepInput.value =
          valor;

      }
    );



    /*
     * ============================
     * CONSULTA AUTOMÁTICA DO CEP
     * ============================
     */

    cepInput.addEventListener(
      'blur',
      async () => {

        const cep =
          cepInput
            .value
            .replace(/\D/g, '');


        /*
         * CEP precisa ter 8 números
         */

        if (cep.length !== 8) {

          cepMessage.textContent =
            'Digite um CEP válido.';

          return;

        }


        cepMessage.textContent =
          'Buscando endereço...';


        try {

          const response =
            await fetch(
              `https://viacep.com.br/ws/${cep}/json/`
            );


          if (!response.ok) {

            throw new Error(
              'Erro na consulta do CEP.'
            );

          }


          const data =
            await response.json();



          /*
           * CEP não encontrado
           */

          if (data.erro) {

            cepMessage.textContent =
              'CEP não encontrado.';

            return;

          }



          /*
           * PREENCHE OS CAMPOS
           */

          ruaInput.value =
            data.logradouro || '';


          bairroInput.value =
            data.bairro || '';


          cidadeInput.value =
            data.localidade || '';


          estadoInput.value =
            data.uf || '';


          cepMessage.textContent =
            'Endereço encontrado.';



          /*
           * Depois de preencher,
           * leva o cursor para o número.
           */

          document
            .getElementById('numero')
            .focus();

        }

        catch (erro) {

          console.error(
            erro
          );

          cepMessage.textContent =
            'Não foi possível consultar o CEP. Preencha o endereço manualmente.';

        }

      }
    );



    /*
     * ============================
     * MÁSCARA DE TELEFONE
     * ============================
     */

    const telefoneInput =
      document.getElementById('telefone');


    telefoneInput.addEventListener(
      'input',
      () => {

        let valor =
          telefoneInput
            .value
            .replace(/\D/g, '')
            .slice(0, 11);


        valor =
          valor.replace(
            /^(\d{2})(\d)/,
            '($1) $2'
          );


        valor =
          valor.replace(
            /(\d{5})(\d{4})$/,
            '$1-$2'
          );


        telefoneInput.value =
          valor;

      }
    );

  </script>

</body>

</html>
