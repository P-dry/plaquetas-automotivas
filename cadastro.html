<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Criar conta</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>


<body>

  <main class="auth-container">

    <section class="auth-card cadastro-card">

      <h1>Criar conta</h1>

      <p>
        Preencha seus dados para criar sua conta.
      </p>


      <form id="signupForm">

        <!-- =====================
             DADOS PESSOAIS
        ====================== -->

        <h2>Dados pessoais</h2>


        <label for="nomeCompleto">
          Nome completo
        </label>

        <input
          type="text"
          id="nomeCompleto"
          placeholder="Seu nome completo"
          required
        >


        <label for="cpf">
          CPF
        </label>

        <input
          type="text"
          id="cpf"
          placeholder="000.000.000-00"
          maxlength="14"
          required
        >


        <label for="dataNascimento">
          Data de nascimento
        </label>

        <input
          type="date"
          id="dataNascimento"
          required
        >


        <label for="telefone">
          Telefone / WhatsApp
        </label>

        <input
          type="tel"
          id="telefone"
          placeholder="(11) 99999-9999"
          maxlength="15"
          required
        >



        <!-- =====================
             ACESSO
        ====================== -->

        <h2>Acesso</h2>


        <label for="email">
          E-mail
        </label>

        <input
          type="email"
          id="email"
          placeholder="seuemail@email.com"
          required
        >


        <label for="password">
          Senha
        </label>

        <input
          type="password"
          id="password"
          placeholder="Crie uma senha"
          minlength="6"
          required
        >



        <!-- =====================
             ENDEREÇO
        ====================== -->

        <h2>Endereço</h2>


        <label for="cep">
          CEP
        </label>

        <input
          type="text"
          id="cep"
          placeholder="00000-000"
          maxlength="9"
          required
        >


        <label for="rua">
          Rua / Avenida
        </label>

        <input
          type="text"
          id="rua"
          placeholder="Nome da rua"
          required
        >


        <label for="numero">
          Número
        </label>

        <input
          type="text"
          id="numero"
          placeholder="Número"
          required
        >


        <label for="complemento">
          Complemento
        </label>

        <input
          type="text"
          id="complemento"
          placeholder="Apartamento, bloco, referência..."
        >


        <label for="bairro">
          Bairro
        </label>

        <input
          type="text"
          id="bairro"
          placeholder="Bairro"
          required
        >


        <label for="cidade">
          Cidade
        </label>

        <input
          type="text"
          id="cidade"
          placeholder="Cidade"
          required
        >


        <label for="estado">
          Estado
        </label>

        <select
          id="estado"
          required
        >

          <option value="">
            Selecione
          </option>

          <option value="AC">AC</option>
          <option value="AL">AL</option>
          <option value="AP">AP</option>
          <option value="AM">AM</option>
          <option value="BA">BA</option>
          <option value="CE">CE</option>
          <option value="DF">DF</option>
          <option value="ES">ES</option>
          <option value="GO">GO</option>
          <option value="MA">MA</option>
          <option value="MT">MT</option>
          <option value="MS">MS</option>
          <option value="MG">MG</option>
          <option value="PA">PA</option>
          <option value="PB">PB</option>
          <option value="PR">PR</option>
          <option value="PE">PE</option>
          <option value="PI">PI</option>
          <option value="RJ">RJ</option>
          <option value="RN">RN</option>
          <option value="RS">RS</option>
          <option value="RO">RO</option>
          <option value="RR">RR</option>
          <option value="SC">SC</option>
          <option value="SP">SP</option>
          <option value="SE">SE</option>
          <option value="TO">TO</option>

        </select>


        <button type="submit">
          Criar conta
        </button>

      </form>


      <p id="signupMessage"></p>


      <p>
        Já tem conta?

        <a href="login.html">
          Entrar
        </a>
      </p>


      <p>
        <a href="index.html">
          Voltar para o site
        </a>
      </p>

    </section>

  </main>



  <script>

    const signupForm =
      document.getElementById(
        'signupForm'
      );

    const signupMessage =
      document.getElementById(
        'signupMessage'
      );


    /*
     * Página para onde o Supabase
     * deverá enviar o cliente depois
     * da confirmação do e-mail.
     */

    const emailRedirectUrl =
      'https://p-dry.github.io/plaquetas-automotivas/confirmado.html';



    /*
     * ============================
     * CADASTRO
     * ============================
     */

    signupForm.addEventListener(
      'submit',
      async (event) => {

        event.preventDefault();


        signupMessage.textContent =
          'Criando conta...';



        /*
         * ============================
         * COLETA DOS DADOS
         * ============================
         */

        const nomeCompleto =
          document
            .getElementById(
              'nomeCompleto'
            )
            .value
            .trim();


        const cpf =
          document
            .getElementById(
              'cpf'
            )
            .value
            .trim();


        const dataNascimento =
          document
            .getElementById(
              'dataNascimento'
            )
            .value;


        const telefone =
          document
            .getElementById(
              'telefone'
            )
            .value
            .trim();


        const email =
          document
            .getElementById(
              'email'
            )
            .value
            .trim();


        const password =
          document
            .getElementById(
              'password'
            )
            .value;


        const cep =
          document
            .getElementById(
              'cep'
            )
            .value
            .trim();


        const rua =
          document
            .getElementById(
              'rua'
            )
            .value
            .trim();


        const numero =
          document
            .getElementById(
              'numero'
            )
            .value
            .trim();


        const complemento =
          document
            .getElementById(
              'complemento'
            )
            .value
            .trim();


        const bairro =
          document
            .getElementById(
              'bairro'
            )
            .value
            .trim();


        const cidade =
          document
            .getElementById(
              'cidade'
            )
            .value
            .trim();


        const estado =
          document
            .getElementById(
              'estado'
            )
            .value;



        try {

          /*
           * ============================
           * CRIA USUÁRIO
           * ============================
           *
           * Os dados pessoais são enviados
           * como metadata.
           *
           * O trigger que criamos no
           * Supabase usa esses dados para
           * criar public.profiles.
           */

          const {
            data: signupData,
            error: signupError
          } =
            await supabaseClient
              .auth
              .signUp({

                email:
                  email,

                password:
                  password,

                options: {

                  /*
                   * IMPORTANTE:
                   * depois de clicar no
                   * e-mail de confirmação,
                   * o usuário retorna para
                   * confirmado.html
                   */

                  emailRedirectTo:
                    emailRedirectUrl,


                  /*
                   * Dados que serão enviados
                   * para raw_user_meta_data.
                   */

                  data: {

                    nome_completo:
                      nomeCompleto,

                    cpf:
                      cpf,

                    data_nascimento:
                      dataNascimento,

                    telefone:
                      telefone

                  }

                }

              });



          /*
           * ============================
           * ERRO NO CADASTRO
           * ============================
           */

          if (signupError) {

            console.error(
              signupError
            );

            signupMessage.textContent =
              'Erro ao criar conta: ' +
              signupError.message;

            return;

          }



          /*
           * Confere se o Supabase realmente
           * retornou um usuário.
           */

          if (!signupData.user) {

            signupMessage.textContent =
              'Não foi possível criar o usuário.';

            return;

          }



          /*
           * ============================
           * ENDEREÇO
           * ============================
           *
           * Se houver uma sessão imediatamente,
           * podemos salvar o endereço agora.
           *
           * Com confirmação de e-mail ligada,
           * normalmente signupData.session será
           * null.
           */

          if (signupData.session) {

            const {
              error: addressError
            } =
              await supabaseClient

                .from('addresses')

                .insert({

                  user_id:
                    signupData.user.id,

                  cep:
                    cep,

                  rua:
                    rua,

                  numero:
                    numero,

                  complemento:
                    complemento,

                  bairro:
                    bairro,

                  cidade:
                    cidade,

                  estado:
                    estado

                });


            if (addressError) {

              console.error(
                addressError
              );

              signupMessage.textContent =
                'Conta criada, mas ocorreu um erro ao salvar o endereço: ' +
                addressError.message;

              return;

            }

          }



          /*
           * ============================
           * ENDEREÇO PENDENTE
           * ============================
           *
           * Guardamos o endereço no navegador.
           *
           * Após a confirmação do e-mail e
           * primeiro login, o login.html
           * salva esses dados no Supabase.
           */

          const enderecoTemporario = {

            cep:
              cep,

            rua:
              rua,

            numero:
              numero,

            complemento:
              complemento,

            bairro:
              bairro,

            cidade:
              cidade,

            estado:
              estado

          };


          localStorage.setItem(
            'enderecoCadastroPendente',
            JSON.stringify(
              enderecoTemporario
            )
          );



          /*
           * ============================
           * SUCESSO
           * ============================
           */

          signupMessage.textContent =
            'Conta criada com sucesso. Enviamos um e-mail de confirmação. Abra o e-mail e clique no link para confirmar sua conta.';


          signupForm.reset();

        }

        catch (erro) {

          console.error(
            erro
          );

          signupMessage.textContent =
            'Erro ao conectar com o sistema de cadastro.';

        }

      }
    );



    /*
     * ============================
     * MÁSCARA DE CPF
     * ============================
     */

    const cpfInput =
      document.getElementById(
        'cpf'
      );


    cpfInput.addEventListener(
      'input',
      () => {

        let valor =
          cpfInput
            .value
            .replace(
              /\D/g,
              ''
            )
            .slice(
              0,
              11
            );


        valor =
          valor.replace(
            /(\d{3})(\d)/,
            '$1.$2'
          );


        valor =
          valor.replace(
            /(\d{3})(\d)/,
            '$1.$2'
          );


        valor =
          valor.replace(
            /(\d{3})(\d{1,2})$/,
            '$1-$2'
          );


        cpfInput.value =
          valor;

      }
    );



    /*
     * ============================
     * MÁSCARA DE CEP
     * ============================
     */

    const cepInput =
      document.getElementById(
        'cep'
      );


    cepInput.addEventListener(
      'input',
      () => {

        let valor =
          cepInput
            .value
            .replace(
              /\D/g,
              ''
            )
            .slice(
              0,
              8
            );


        valor =
          valor.replace(
            /(\d{5})(\d)/,
            '$1-$2'
          );


        cepInput.value =
          valor;

      }
    );



    /*
     * ============================
     * MÁSCARA DE TELEFONE
     * ============================
     */

    const telefoneInput =
      document.getElementById(
        'telefone'
      );


    telefoneInput.addEventListener(
      'input',
      () => {

        let valor =
          telefoneInput
            .value
            .replace(
              /\D/g,
              ''
            )
            .slice(
              0,
              11
            );


        valor =
          valor.replace(
            /^(\d{2})(\d)/,
            '($1) $2'
          );


        valor =
          valor.replace(
            /(\d{5})(\d{4})$/,
            '$1-$2'
          );


        telefoneInput.value =
          valor;

      }
    );

  </script>

</body>

</html>
